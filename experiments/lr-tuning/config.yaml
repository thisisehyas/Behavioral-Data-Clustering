# Learning Rate Tuning for DEC

experiment:
  name: lr_tuning
  description: >
    Systematic learning rate tuning for Deep Embedded Clustering (DEC)
    on the roommate compatibility dataset. 
  output_dir: experiments/lr-tuning/runs
  ae_checkpoint_path: models/autoencoder_weights.pth

dataset:
  source: compressed_features_standardized
  input_dim: 7
  latent_dim: 5
  train_split: 0.8
  val_split: 0.2
  split_seed: 42

dec:
  num_clusters: 5
  update_interval: 20
  encoder_frozen: true
  optimizer: adam
  max_iterations: 5

sweep:
  learning_rates: [1e-3]
  seeds: [0]

# sweep:
#   learning_rates:
#     - 1e-4
#     - 3e-4
#     - 1e-3
#     - 3e-3
#     - 1e-2
#   seeds: [0, 1, 2]

logging:
  save_kl_train: true
  save_kl_val: true
  save_q_val: true
  save_cluster_centers: true
  save_labels_val: true