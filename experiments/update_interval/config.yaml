# Update Interval Sensitivity Experiment Configuration

experiment:
  name: update_interval_sensitivity
  description: >
    Sensitivity analysis of the DEC target distribution update interval
    on the roommate compatibility dataset.
  output_dir: experiments/update_interval/runs
  ae_checkpoint_path: models/autoencoder_weights.pth

dataset:
  source: compressed_features_standardized
  input_dim: 7
  latent_dim: 5
  train_split: 0.8
  val_split: 0.2
  split_seed: 42

dec:
  num_clusters: 5
  alpha: 1.0
  learning_rate: 0.001
  optimizer: adam
  encoder_frozen: true
  update_interval: 20
  max_epochs: 50
  batch_size: 256

sweep:
  update_intervals:
    - 1
    - 5
    - 10
    - 20
    - 50
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4

logging:
  save_kl_train: true
  save_kl_val: true
  save_q_val: true
  save_cluster_centers: true
  save_labels_val: true