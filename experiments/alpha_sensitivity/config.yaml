# Alpha Sensitivity Experiment Configuration

experiment:
  name: alpha_sensitivity
  description: >
    Sensitivity analysis of the Student-t distribution parameter (alpha)
    for Deep Embedded Clustering (DEC) on the roommate compatibility dataset.
  output_dir: experiments/alpha_sensitivity/runs
  ae_checkpoint_path: models/autoencoder_weights.pth

dataset:
  source: compressed_features_standardized
  input_dim: 7
  latent_dim: 5
  train_split: 0.8
  val_split: 0.2
  split_seed: 42

dec:
  num_clusters: 5
  alpha: 1.0
  learning_rate: 0.003 # 3e-3
  optimizer: adam
  encoder_frozen: true
  update_interval: 20
  max_epochs: 50
  batch_size: 256

sweep:
  alphas:
    - 0.1
    - 0.5
    - 1.0
    - 2.0
    - 5.0
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4

logging:
  save_kl_train: true
  save_kl_val: true
  save_q_val: true
  save_cluster_centers: true
  save_labels_val: true
