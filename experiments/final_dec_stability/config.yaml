# Final DEC Stability Experiment Configuration

experiment:
  name: final_stability
  description: >
    Stability analysis of the final Deep Embedded Clustering (DEC)
    configuration across multiple random seeds on the full roommate
    compatibility dataset.
  output_dir: experiments/final_stability/runs
  ae_checkpoint_path: models/autoencoder_weights.pth

dataset:
  source: compressed_features_standardized
  input_dim: 7
  latent_dim: 5

dec:
  num_clusters: 5
  alpha: 0.5
  learning_rate: 0.003  # 3e-3
  optimizer: adam
  encoder_frozen: true
  update_interval: 20
  max_epochs: 50
  batch_size: 256
  n_init: 20

sweep:
  seeds:
    - 42
    - 43
    - 44
    - 45
    - 46

logging:
  save_kl_train: true
  save_q_full: true
  save_cluster_centers: true
  save_labels_full: true
  save_embeddings_full: true